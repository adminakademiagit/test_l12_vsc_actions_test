name: warunki

on:
  workflow_dispatch:
    inputs:
      wybor_klienta:
        description: 'Wybierz klienta:'
        required: true
        default: 'Contoso'
        type: choice
        options:
          - Contoso
          - Nwtraders
          - Arcacorp

jobs:
  sprawdzanie:
    runs-on: ubuntu-latest
    steps:
      - name: Informacje o przebiegu
        run: echo "Zdarzenie $ZDARZENIE, system $SYSTEM, klient $KLIENT"
        env:
          ZDARZENIE: ${{ github.event_name }}
          SYSTEM: ${{ runner.os }}
          KLIENT: ${{ inputs.wybor_klienta }}

      - name: Tylko dla klienta Arcacorp
        if: inputs.wybor_klienta == 'Arcacorp'
        run: echo "Dodatkowa obsługa klienta Arcacorp"

      - name: Dla klienta Contoso albo Nwtraders
        if: inputs.wybor_klienta == 'Contoso' || inputs.wybor_klienta == 'Nwtraders'
        run: echo "Standardowa obsługa klienta"

      - name: Uruchomienie ręczne na Linuksie
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: echo "Przebieg uruchomiony ręcznie na runnerze z Linuksem"

      - name: Tylko z harmonogramu
        if: github.event_name == 'schedule'
        run: echo "Przebieg z harmonogramu"

      - name: Wielkość liter w porównaniu
        if: inputs.wybor_klienta == 'ARCACORP'
        run: echo "Porównanie napisów nie rozróżnia wielkości liter"
