name: cache_nftables

on:
  workflow_dispatch:

jobs:
  pobieranie:
    runs-on: ubuntu-latest
    env:
      NFT_URL: https://www.netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz
      NFT_DIR: downloads
      NFT_KEY_FILE: downloads/nftables.url
    steps:
      - name: Przygotuj katalog i plik z URL do klucza cache
        run: |
          mkdir -p "$NFT_DIR"
          echo "$NFT_URL" > "$NFT_KEY_FILE"

      - name: Przywróć/zapisz cache dla nftables
        id: cache-nft
        uses: actions/cache@v6
        with:
          path: ${{ env.NFT_DIR }}/*.tar.xz
          key: nftables-zad1-${{ runner.os }}-${{ hashFiles(env.NFT_KEY_FILE) }}
          restore-keys: |
            nftables-zad1-${{ runner.os }}-

      - name: Pokaż wynik cache
        run: echo "cache-hit = '$WYNIK'"
        env:
          WYNIK: ${{ steps.cache-nft.outputs.cache-hit }}

      - name: Pobierz nftables (jeśli brak w cache)
        if: steps.cache-nft.outputs.cache-hit != 'true'
        run: |
          echo "Pobieram z: $NFT_URL"
          curl -fsSL "$NFT_URL" -o "$NFT_DIR/$(basename "$NFT_URL")"

      - name: Zawartość katalogu downloads
        run: ls -lh "$NFT_DIR"
