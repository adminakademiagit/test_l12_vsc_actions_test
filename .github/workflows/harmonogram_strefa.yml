name: harmonogram_strefa

on:
  schedule:
    - cron: '55 17 * * *'
      timezone: "Europe/Warsaw"
  workflow_dispatch:

jobs:
  sprawdz_czas:
    runs-on: ubuntu-latest
    steps:
      - name: Kiedy ruszyliśmy
        run: |
          echo "Zdarzenie: $ZDARZENIE"
          echo "Wpis harmonogramu: $WPIS"
          echo "Czas UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Czas polski: $(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M:%S')"
        env:
          ZDARZENIE: ${{ github.event_name }}
          WPIS: ${{ github.event.schedule }}
